[pytest]
# v5.3.0 M1 测试基建（docs/v5.3/PLAN.md §M1）
# 运行：python -m pytest tests/ -x -q（Windows 需 AstrBot 捆绑解释器，见 BASELINE.md §1）
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = --tb=short
filterwarnings =
    ignore::DeprecationWarning
