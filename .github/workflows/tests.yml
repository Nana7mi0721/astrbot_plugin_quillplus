# v5.3.0 M1 测试基建 CI（docs/v5.3/PLAN.md §M1.4）
# 纯 stub 环境（无 AstrBot 真机依赖）；双平台矩阵——Windows 专门用于
# 捕获路径分隔符类 bug（原版在此有第一手教训，PLAN §M1.4）。
name: tests

on:
  push:
    branches: [main, "v5.3/**"]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: pytest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Run tests (stub environment, strict)
        env:
          ASTRBOT_TEST_STRICT: "1"
        run: python -m pytest tests/ -q --tb=short
